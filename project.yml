name: Wakebar
minimumXcodeGenVersion: 2.46.0

options:
  bundleIdPrefix: com.24gunv
  createIntermediateGroups: true
  defaultConfig: Debug
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  indentWidth: 4
  tabWidth: 4
  usesTabs: false
  xcodeVersion: "26.0"
  projectFormat: xcode16_3

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configurations/Debug.xcconfig
  Release: Configurations/Release.xcconfig

fileGroups:
  - Configurations
  - Resources

settings:
  base:
    DEAD_CODE_STRIPPING: true
    LOCALIZATION_PREFERS_STRING_CATALOGS: true

targets:
  WakebarCore:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/WakebarCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.24gunv.wakebar.core
        PRODUCT_NAME: WakebarCore
        SKIP_INSTALL: true
        DEFINES_MODULE: true

  Wakebar:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/WakebarApp
      - path: Resources/WakebarMac/Assets.xcassets
    dependencies:
      - target: WakebarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.24gunv.wakebar
        PRODUCT_NAME: Wakebar
        INFOPLIST_FILE: Resources/WakebarMac/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Release only: the Debug self-signed identity has no Team ID, so
        # hardened-runtime library validation would reject the embedded
        # WakebarCore framework (see Configurations/Debug.xcconfig).
        Release:
          ENABLE_HARDENED_RUNTIME: true
  WakebarCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/WakebarTests
    dependencies:
      - target: WakebarCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.24gunv.wakebar.core-tests
        PRODUCT_NAME: WakebarCoreTests

  WakebarAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/WakebarAppTests
    dependencies:
      - target: Wakebar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.24gunv.wakebar.app-tests
        PRODUCT_NAME: WakebarAppTests

schemes:
  Wakebar:
    build:
      targets:
        Wakebar: all
        WakebarCoreTests: [test]
        WakebarAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - WakebarCoreTests
        - WakebarAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
