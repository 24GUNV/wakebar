<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-labelledby="title description">
  <title id="title">Wakebar provider flow</title>
  <desc id="description">A local Wakebar schedule produces automatic Claude Routine synchronization and manual ChatGPT task instructions. Provider usage data supplies the measured Codex verdict.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#8B93A7"/>
    </marker>
    <style>
      .primary { fill: #172033; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .secondary { fill: #697386; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #5A5CD3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 750; letter-spacing: 1.2px; }
      .card { fill: #FFFFFF; stroke: #E1E5ED; stroke-width: 1.5; }
      .link { fill: none; stroke: #8B93A7; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="880" height="540" rx="34" fill="#F3F5F9"/>
  <text x="54" y="58" class="primary" font-size="28" font-weight="720">One local schedule, two provider paths</text>
  <text x="54" y="88" class="secondary" font-size="17">Wakebar automates configuration where supported and measures uncertain behavior.</text>

  <rect x="54" y="136" width="228" height="268" rx="22" class="card"/>
  <rect x="76" y="158" width="52" height="52" rx="15" fill="#5A5CD3"/>
  <path d="M91 184h22M102 173v22" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <text x="76" y="246" class="eyebrow">WAKEBAR</text>
  <text x="76" y="280" class="primary" font-size="22" font-weight="680">Local schedule</text>
  <text x="76" y="314" class="secondary" font-size="16">Morning time</text>
  <text x="76" y="341" class="secondary" font-size="16">Selected weekdays</text>
  <text x="76" y="368" class="secondary" font-size="16">Five-hour cadence</text>

  <path d="M282 220H342" class="link"/>
  <path d="M282 326H342" class="link"/>

  <rect x="346" y="128" width="480" height="176" rx="22" class="card"/>
  <rect x="368" y="150" width="112" height="28" rx="14" fill="#F0EEFF"/>
  <text x="424" y="169" class="eyebrow" text-anchor="middle">AUTOMATIC</text>
  <text x="368" y="214" class="primary" font-size="22" font-weight="680">Claude Code Routines</text>
  <text x="368" y="244" class="secondary" font-size="16">List, compare, and write only changes.</text>
  <text x="368" y="272" class="secondary" font-size="16">Re-sync at launch, every 24 hours, and after token changes.</text>
  <circle cx="790" cy="215" r="15" fill="#DDF7E8"/>
  <path d="M783 215l5 5 10-12" fill="none" stroke="#208A55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="346" y="326" width="480" height="166" rx="22" class="card"/>
  <rect x="368" y="348" width="92" height="28" rx="14" fill="#FFF2E1"/>
  <text x="414" y="367" fill="#A05A13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="750" letter-spacing="1.1" text-anchor="middle">MANUAL</text>
  <text x="368" y="412" class="primary" font-size="22" font-weight="680">ChatGPT scheduled task</text>
  <text x="368" y="442" class="secondary" font-size="16">Copy exact names, local schedules, and prompt.</text>
  <text x="368" y="470" class="secondary" font-size="16">Provider usage data supplies the stored Codex verdict.</text>
  <path d="M760 398a24 24 0 1 0 0 48 24 24 0 1 0 0-48zm0 10v15l10 6" fill="none" stroke="#5A5CD3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
