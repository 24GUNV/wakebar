<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1040" viewBox="0 0 680 1040" role="img" aria-labelledby="title description">
  <title id="title">Wakebar setup and execution flow</title>
  <desc id="description">Wakebar has two independent paths. The user manually creates and confirms provider-hosted tasks. Wakebar also publishes an alarm schedule through iCloud for the iPhone to apply and confirm.</desc>
  <defs>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d1d1f; }
      .secondary { fill: #6e6e73; }
      .line { fill: none; stroke: #c7c7cc; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .label { font-size: 17px; font-weight: 700; letter-spacing: 1.2px; fill: #6e6e73; }
      .accent { fill: #5757d9; }
    </style>
  </defs>

  <rect width="680" height="1040" rx="28" fill="#fafafa" stroke="#e4e4e7"/>
  <g class="text">
    <rect x="70" y="40" width="540" height="112" rx="18" fill="#ffffff" stroke="#d8d8dc"/>
    <rect x="98" y="68" width="52" height="52" rx="13" class="accent"/>
    <circle cx="124" cy="94" r="15" fill="none" stroke="#fff" stroke-width="2.7"/>
    <path d="M124 94v-10M124 94l-7 8" fill="none" stroke="#fff" stroke-width="2.7" stroke-linecap="round"/>
    <text x="176" y="91" font-size="26" font-weight="650">Wake schedule</text>
    <text x="176" y="124" font-size="19" class="secondary">Wake time · weekdays · providers</text>

    <path d="M340 152v44M333 185l7 11 7-11" class="line"/>
    <rect x="70" y="196" width="540" height="136" rx="20" fill="#ffffff" stroke="#d8d8dc"/>
    <text x="102" y="243" font-size="27" font-weight="650">Wakebar on Mac</text>
    <text x="102" y="279" font-size="19" class="secondary">Builds provider setup text and the alarm schedule.</text>
    <text x="102" y="309" font-size="19" class="secondary">Reports provider and iPhone confirmation separately.</text>

    <text x="340" y="374" class="label" text-anchor="middle">TWO INDEPENDENT PATHS</text>
    <path d="M340 332v62M340 394H180v28M340 394h160v28" class="line"/>
    <path d="M173 411l7 11 7-11M493 411l7 11 7-11" class="line"/>

    <text x="180" y="455" class="label" text-anchor="middle">PROVIDER SETUP</text>
    <rect x="35" y="473" width="290" height="392" rx="20" fill="#ffffff" stroke="#d8d8dc"/>
    <circle cx="75" cy="521" r="18" fill="#5757d9" opacity="0.12"/>
    <text x="75" y="528" font-size="19" font-weight="700" class="accent" text-anchor="middle">1</text>
    <text x="108" y="516" font-size="20" font-weight="650">Copy setup text</text>
    <text x="108" y="544" font-size="17" class="secondary">Use “Copy Routine setup”</text>
    <text x="108" y="568" font-size="17" class="secondary">or “Copy Codex setup.”</text>

    <line x1="67" y1="592" x2="293" y2="592" stroke="#e4e4e7"/>
    <circle cx="75" cy="636" r="18" fill="#5757d9" opacity="0.12"/>
    <text x="75" y="643" font-size="19" font-weight="700" class="accent" text-anchor="middle">2</text>
    <text x="108" y="631" font-size="20" font-weight="650">Create hosted tasks</text>
    <text x="108" y="659" font-size="17" class="secondary">You create them in Claude</text>
    <text x="108" y="683" font-size="17" class="secondary">and ChatGPT. Wakebar cannot.</text>

    <line x1="67" y1="707" x2="293" y2="707" stroke="#e4e4e7"/>
    <circle cx="75" cy="751" r="18" fill="#5757d9" opacity="0.12"/>
    <text x="75" y="758" font-size="19" font-weight="700" class="accent" text-anchor="middle">3</text>
    <text x="108" y="746" font-size="20" font-weight="650">Confirm in Wakebar</text>
    <text x="108" y="774" font-size="17" class="secondary">Confirm the saved times</text>
    <text x="108" y="798" font-size="17" class="secondary">after checking each provider.</text>

    <rect x="47" y="817" width="266" height="30" rx="15" fill="#5757d9" opacity="0.1"/>
    <text x="180" y="838" font-size="15" font-weight="650" class="accent" text-anchor="middle">Provider hosted · Mac can be off</text>

    <text x="500" y="455" class="label" text-anchor="middle">IPHONE ALARM</text>
    <rect x="355" y="473" width="290" height="392" rx="20" fill="#ffffff" stroke="#d8d8dc"/>
    <circle cx="395" cy="521" r="18" fill="#5757d9" opacity="0.12"/>
    <text x="395" y="528" font-size="19" font-weight="700" class="accent" text-anchor="middle">1</text>
    <text x="428" y="516" font-size="20" font-weight="650">Publish to iCloud</text>
    <text x="428" y="544" font-size="17" class="secondary">Wakebar publishes a</text>
    <text x="428" y="568" font-size="17" class="secondary">versioned alarm schedule.</text>

    <line x1="387" y1="592" x2="613" y2="592" stroke="#e4e4e7"/>
    <circle cx="395" cy="636" r="18" fill="#5757d9" opacity="0.12"/>
    <text x="395" y="643" font-size="19" font-weight="700" class="accent" text-anchor="middle">2</text>
    <text x="428" y="631" font-size="20" font-weight="650">Apply on iPhone</text>
    <text x="428" y="659" font-size="17" class="secondary">The companion receives</text>
    <text x="428" y="683" font-size="17" class="secondary">and applies the revision.</text>

    <line x1="387" y1="707" x2="613" y2="707" stroke="#e4e4e7"/>
    <circle cx="395" cy="751" r="18" fill="#5757d9" opacity="0.12"/>
    <text x="395" y="758" font-size="19" font-weight="700" class="accent" text-anchor="middle">3</text>
    <text x="428" y="746" font-size="20" font-weight="650">Confirm AlarmKit</text>
    <text x="428" y="774" font-size="17" class="secondary">The iPhone acknowledges</text>
    <text x="428" y="798" font-size="17" class="secondary">only after it applies the alarm.</text>

    <rect x="367" y="817" width="266" height="30" rx="15" fill="#5757d9" opacity="0.1"/>
    <text x="500" y="838" font-size="15" font-weight="650" class="accent" text-anchor="middle">Confirmed · Mac can be off</text>

    <rect x="70" y="903" width="540" height="96" rx="18" fill="#ffffff" stroke="#d8d8dc"/>
    <circle cx="105" cy="951" r="17" fill="#ff9f0a" opacity="0.15"/>
    <path d="M105 941v13M105 961v1" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/>
    <text x="137" y="942" font-size="20" font-weight="650">Result boundary</text>
    <text x="137" y="972" font-size="18" class="secondary">A sent prompt does not prove that a usage window reset.</text>
  </g>
</svg>
