<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-labelledby="title description">
  <title id="title">From schedule to confirmed usage</title>
  <desc id="description">Wakebar uses your local schedule to sync a Claude Code cloud Routine or send a Codex request from your Mac. After the prompt, it checks provider usage to confirm the window started.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1l5 3-5 3" fill="none" stroke="#858585" stroke-width="1.2"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .heading { fill: #222; font-size: 19px; font-weight: 600; }
      .body { fill: #626262; font-size: 16px; }
      .label { fill: #777; font-size: 13px; }
      .line { fill: none; stroke: #858585; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="880" height="340" fill="#fff"/>
  <text x="28" y="34" class="label">SCHEDULE</text>
  <text x="370" y="34" class="label">SEND A SHORT PROMPT</text>
  <path d="M28 49h824" stroke="#dedede"/>

  <text x="28" y="141" class="heading">Your wake time</text>
  <text x="28" y="168" class="body">Weekdays, with a lead time.</text>
  <text x="28" y="192" class="body">Wakebar prepares the schedule.</text>

  <path d="M280 158h36V105h34M316 158v58h34" class="line"/>
  <path d="M338 105h12" class="line" marker-end="url(#arrow)"/>
  <path d="M338 216h12" class="line" marker-end="url(#arrow)"/>

  <text x="370" y="91" class="heading">Claude Code</text>
  <text x="370" y="117" class="body">A synced Routine runs in the cloud.</text>
  <text x="370" y="141" class="body">It can fire while your Mac sleeps.</text>

  <text x="370" y="202" class="heading">Codex</text>
  <text x="370" y="228" class="body">Wakebar sends a request from your Mac.</text>
  <text x="370" y="252" class="body">The app must be running.</text>

  <path d="M28 280h824" stroke="#dedede"/>
  <text x="28" y="312" class="heading">After the prompt</text>
  <text x="230" y="312" class="body">Wakebar checks provider usage before reporting a started window.</text>
</svg>
