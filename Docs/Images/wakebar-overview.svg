<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title description">
  <title id="title">Wakebar menu overview</title>
  <desc id="description">A compact macOS menu shows the next planned session, Claude and Codex setup status, provider usage, and the next refresh.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#111827" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6466E9"/>
      <stop offset="1" stop-color="#4949C8"/>
    </linearGradient>
    <style>
      .primary { fill: #172033; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .secondary { fill: #697386; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #858DA0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.3px; }
    </style>
  </defs>
  <rect width="760" height="520" rx="34" fill="#F1F3F8"/>
  <rect x="106" y="40" width="548" height="440" rx="24" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="106" y="40" width="548" height="150" rx="24" fill="url(#hero)"/>
  <path d="M106 166h548v24H106z" fill="url(#hero)"/>
  <text x="138" y="78" fill="#DCDDFE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">NEXT SESSION</text>
  <text x="138" y="128" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="720">6:50 AM</text>
  <text x="138" y="159" fill="#E8E8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Monday · Weekdays · 10 minutes before</text>

  <text x="138" y="228" class="label">SERVICES</text>
  <text x="138" y="268" class="primary" font-size="19" font-weight="620">Claude Code</text>
  <text x="620" y="268" class="secondary" font-size="17" text-anchor="end">Ready</text>
  <line x1="138" y1="286" x2="622" y2="286" stroke="#E7EAF0"/>
  <text x="138" y="324" class="primary" font-size="19" font-weight="620">Codex</text>
  <rect x="216" y="302" width="118" height="28" rx="14" fill="#EEF0FF"/>
  <text x="275" y="321" fill="#5557CF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">WINDOW VERIFIED</text>
  <text x="620" y="324" class="secondary" font-size="17" text-anchor="end">Task confirmed</text>

  <rect x="122" y="352" width="516" height="76" rx="16" fill="#F7F8FB"/>
  <text x="142" y="381" class="secondary" font-size="15">Claude five-hour reset</text>
  <text x="618" y="381" class="primary" font-size="15" font-weight="620" text-anchor="end">11:51 AM · 7% used</text>
  <text x="142" y="409" class="secondary" font-size="15">Next refresh</text>
  <text x="618" y="409" class="primary" font-size="15" font-weight="620" text-anchor="end">11:50 AM</text>

  <line x1="106" y1="446" x2="654" y2="446" stroke="#E7EAF0"/>
  <text x="138" y="470" class="primary" font-size="15" font-weight="620">Edit Schedule…</text>
  <circle cx="621" cy="466" r="3" fill="#697386"/>
  <circle cx="609" cy="466" r="3" fill="#697386"/>
  <circle cx="597" cy="466" r="3" fill="#697386"/>
</svg>
