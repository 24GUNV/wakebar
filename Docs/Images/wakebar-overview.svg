<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" aria-labelledby="title description">
  <title id="title">Wakebar compact macOS menu</title>
  <desc id="description">A compact ready-state menu showing the next wake time, manually confirmed Claude and Codex schedules, an iPhone alarm, the next five-hour refresh, and safe schedule and More actions.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#111118" flood-opacity="0.11"/>
    </filter>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d1d1f; }
      .secondary { fill: #6e6e73; }
      .hairline { stroke: #dedee3; stroke-width: 1; }
      .success { fill: #248a3d; }
      .accent { fill: #5757d9; }
    </style>
  </defs>

  <rect width="680" height="500" rx="28" fill="#f4f4f7"/>
  <g filter="url(#shadow)">
    <rect x="32" y="32" width="616" height="436" rx="22" fill="#ffffff" stroke="#d8d8dc"/>
  </g>

  <g class="text">
    <text x="64" y="77" font-size="18" class="secondary">Tomorrow</text>
    <text x="64" y="112" font-size="31" font-weight="700">7:00 AM</text>
    <text x="64" y="140" font-size="18" class="secondary">Sessions start at 6:50 AM</text>

    <g aria-label="Ready">
      <circle cx="535" cy="91" r="10" class="success"/>
      <path d="M530 91l3 3 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="558" y="97" font-size="18" class="success">Ready</text>
    </g>

    <line x1="64" y1="164" x2="648" y2="164" class="hairline"/>

    <text x="64" y="204" font-size="20">Claude Code</text>
    <text x="579" y="204" font-size="17" class="secondary" text-anchor="end">Confirmed by you</text>
    <circle cx="614" cy="198" r="9" fill="#8e8e93"/>
    <path d="M610 198l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="64" y="247" font-size="20">Codex</text>
    <text x="579" y="247" font-size="17" class="secondary" text-anchor="end">Confirmed by you</text>
    <circle cx="614" cy="241" r="9" fill="#8e8e93"/>
    <path d="M610 241l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="64" y="290" font-size="20">iPhone alarm</text>
    <text x="579" y="290" font-size="17" class="secondary" text-anchor="end">Alarm confirmed</text>
    <circle cx="614" cy="284" r="9" fill="#8e8e93"/>
    <path d="M610 284l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="64" y1="314" x2="648" y2="314" class="hairline"/>
    <text x="64" y="350" font-size="17" class="secondary">Every 5 hours · next 11:50 AM</text>

    <line x1="32" y1="378" x2="648" y2="378" class="hairline"/>

    <g aria-label="Edit Schedule">
      <rect x="58" y="399" width="186" height="42" rx="9" fill="#f1f1f4"/>
      <rect x="76" y="410" width="15" height="14" rx="2" fill="none" stroke="#5757d9" stroke-width="1.7"/>
      <path d="M76 415h15M80 407v6M87 407v6" fill="none" stroke="#5757d9" stroke-width="1.7" stroke-linecap="round"/>
      <text x="102" y="426" font-size="18" class="accent">Edit Schedule…</text>
    </g>

    <g aria-label="More">
      <text x="554" y="426" font-size="18">More</text>
      <circle cx="616" cy="420" r="3" fill="#6e6e73"/>
      <circle cx="626" cy="420" r="3" fill="#6e6e73"/>
      <circle cx="636" cy="420" r="3" fill="#6e6e73"/>
    </g>
  </g>
</svg>
