<svg xmlns="http://www.w3.org/2000/svg" width="680" height="690" viewBox="0 0 680 690" role="img" aria-labelledby="title description">
  <title id="title">Wakebar macOS menu-bar interface</title>
  <desc id="description">A manually confirmed wake schedule using the current Wakebar menu labels. The combined provider row uses provider-specific minimal prompts: Claude asks for yes and Codex sends hi.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#111118" flood-opacity="0.11"/>
    </filter>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d1d1f; }
      .secondary { fill: #6e6e73; }
      .hairline { stroke: #dedee3; stroke-width: 1; }
      .accent { fill: #5757d9; }
    </style>
  </defs>

  <rect width="680" height="690" rx="28" fill="#f4f4f7"/>
  <g filter="url(#shadow)">
    <rect x="32" y="32" width="616" height="626" rx="22" fill="#ffffff" stroke="#d8d8dc"/>
  </g>

  <g class="text">
    <text x="64" y="82" font-size="25" font-weight="650">Wakebar</text>
    <text x="474" y="82" font-size="18" class="secondary" text-anchor="end">Ready</text>
    <text x="616" y="82" font-size="19" class="accent" text-anchor="end">Edit schedule</text>
    <line x1="64" y1="106" x2="648" y2="106" class="hairline"/>

    <text x="64" y="151" font-size="21" class="secondary">Next wake</text>
    <text x="616" y="151" font-size="25" font-weight="650" text-anchor="end">Monday 7:00 AM</text>
    <line x1="64" y1="179" x2="648" y2="179" class="hairline"/>

    <text x="64" y="231" font-size="18" class="secondary">6:50 AM</text>
    <circle cx="167" cy="225" r="15" fill="#5757d9" opacity="0.12"/>
    <path d="M167 214v22M156 225h22" stroke="#5757d9" stroke-width="2.2" stroke-linecap="round"/>
    <text x="198" y="219" font-size="21" font-weight="600">Start Claude Code and Codex</text>
    <text x="198" y="247" font-size="18" class="secondary">Cloud · confirmed by you</text>
    <text x="198" y="271" font-size="18" class="secondary">provider-specific minimal prompts</text>
    <circle cx="616" cy="225" r="12" fill="#34c759"/>
    <path d="M610 225l4 4 8-10" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="64" y1="292" x2="648" y2="292" class="hairline"/>

    <text x="64" y="344" font-size="18" class="secondary">7:00 AM</text>
    <circle cx="167" cy="338" r="15" fill="#5757d9" opacity="0.12"/>
    <path d="M159 339a8 8 0 1 1 16 0M160 329l-5-5M174 329l5-5M161 347l-2 5M173 347l2 5" fill="none" stroke="#5757d9" stroke-width="2" stroke-linecap="round"/>
    <text x="198" y="332" font-size="21" font-weight="600">Wake alarm</text>
    <text x="198" y="362" font-size="18" class="secondary">Confirmed on iPhone · revision 12</text>
    <circle cx="616" cy="338" r="12" fill="#34c759"/>
    <path d="M610 338l4 4 8-10" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="64" y1="392" x2="648" y2="392" class="hairline"/>

    <text x="64" y="444" font-size="18" class="secondary">11:50 AM</text>
    <circle cx="167" cy="438" r="15" fill="#5757d9" opacity="0.12"/>
    <path d="M160 434a8 8 0 0 1 13-1l3 3M176 430v6h-6M174 444a8 8 0 0 1-13 1l-3-3M158 448v-6h6" fill="none" stroke="#5757d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="198" y="432" font-size="21" font-weight="600">Session refreshes</text>
    <text x="198" y="462" font-size="18" class="secondary">2 refreshes planned</text>
    <circle cx="616" cy="438" r="12" fill="#34c759"/>
    <path d="M610 438l4 4 8-10" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="32" y1="523" x2="648" y2="523" class="hairline"/>
    <g aria-label="Settings">
      <circle cx="456" cy="584" r="20" fill="#f1f1f4"/>
      <circle cx="456" cy="584" r="7" fill="none" stroke="#6e6e73" stroke-width="1.9"/>
      <path d="M456 571v5M456 592v5M443 584h5M464 584h5M447 575l4 4M465 593l4 4M469 575l-4 4M451 593l-4 4" fill="none" stroke="#6e6e73" stroke-width="1.9" stroke-linecap="round"/>
    </g>
    <g aria-label="Quit Wakebar">
      <circle cx="510" cy="584" r="20" fill="#f1f1f4"/>
      <path d="M510 573v12M503 583a9 9 0 1 0 14 0" fill="none" stroke="#6e6e73" stroke-width="2" stroke-linecap="round"/>
    </g>
    <path d="M551 575l14 9-14 9z" class="accent"/>
    <text x="574" y="590" font-size="19" class="accent">Preview</text>
  </g>
</svg>
