name: Build and test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: wakebar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-platforms:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test shared core and macOS app
        run: >-
          xcodebuild
          -project Wakebar.xcodeproj
          -scheme Wakebar
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Test iPhone companion
        run: |
          wakebar_simulator_id="$(python3 Scripts/select_ios_simulator.py)"
          test -n "$wakebar_simulator_id"
          xcodebuild \
            -project Wakebar.xcodeproj \
            -scheme WakebarPhone \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$wakebar_simulator_id" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build macOS Release configuration
        run: >-
          xcodebuild
          -project Wakebar.xcodeproj
          -scheme Wakebar
          -configuration Release
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build iPhone Release configuration
        run: >-
          xcodebuild
          -project Wakebar.xcodeproj
          -scheme WakebarPhone
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
