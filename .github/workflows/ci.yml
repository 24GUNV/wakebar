name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: wakebar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Set build paths
        run: |
          echo "CLANG_MODULE_CACHE_PATH=$RUNNER_TEMP/wakebar-clang-module-cache" >> "$GITHUB_ENV"
          echo "SWIFTPM_MODULECACHE_OVERRIDE=$RUNNER_TEMP/wakebar-clang-module-cache" >> "$GITHUB_ENV"
          echo "WAKEBAR_SCRATCH_PATH=$RUNNER_TEMP/wakebar-swift-scratch" >> "$GITHUB_ENV"
          echo "WAKEBAR_SPM_CACHE_PATH=$RUNNER_TEMP/wakebar-swiftpm-cache" >> "$GITHUB_ENV"
          echo "WAKEBAR_DERIVED_DATA_PATH=$RUNNER_TEMP/wakebar-derived-data" >> "$GITHUB_ENV"
          echo "WAKEBAR_SNAPSHOT_DIR=$RUNNER_TEMP/wakebar-snapshots" >> "$GITHUB_ENV"
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Require Xcode 26
        run: |
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 26\.'

      - name: Install XcodeGen 2.46.0
        run: |
          curl --fail --location --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Restore SwiftPM download cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.WAKEBAR_SPM_CACHE_PATH }}
          key: swiftpm-${{ runner.os }}-xcode26-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-xcode26-

      - name: Prepare clean compiler paths
        run: |
          mkdir -p "$CLANG_MODULE_CACHE_PATH"
          mkdir -p "$WAKEBAR_SCRATCH_PATH"
          mkdir -p "$WAKEBAR_SPM_CACHE_PATH"
          mkdir -p "$WAKEBAR_DERIVED_DATA_PATH"
          mkdir -p "$WAKEBAR_SNAPSHOT_DIR"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Require generated project to be committed
        run: git diff --exit-code -- Wakebar.xcodeproj/project.pbxproj

      - name: Parse Swift sources
        run: find Sources Tests -name '*.swift' -print0 | xargs -0 -n 1 swiftc -frontend -parse

      - name: Test core and app targets
        run: >-
          swift test
          --disable-sandbox
          --cache-path "$WAKEBAR_SPM_CACHE_PATH"
          --scratch-path "$WAKEBAR_SCRATCH_PATH"

      - name: Validate release package workflow
        run: |
          bash -n Scripts/package_app.sh
          Scripts/package_app.sh --dry-run

      - name: Build unsigned Release app
        run: >-
          xcodebuild
          -project Wakebar.xcodeproj
          -scheme Wakebar
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath "$WAKEBAR_DERIVED_DATA_PATH"
          CLANG_MODULE_CACHE_PATH="$CLANG_MODULE_CACHE_PATH"
          CODE_SIGNING_ALLOWED=NO
          ARCHS="arm64 x86_64"
          ONLY_ACTIVE_ARCH=NO
          build
